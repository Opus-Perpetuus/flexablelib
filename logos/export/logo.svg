<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">flexablelib</title>
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
  </defs>

  <!-- Icon: rounded terminal table with decimal axis -->
  <g id="icon" transform="translate(64,76)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="360" height="360" rx="28" ry="28" fill="none" stroke="#312E81" stroke-width="16"/>

    <!-- Header band -->
    <rect x="28" y="36" width="304" height="48" rx="8" fill="url(#headerGrad)"/>

    <!-- Double rule under header -->
    <rect x="28" y="100" width="304" height="6" fill="#4338CA"/>
    <rect x="28" y="112" width="304" height="6" fill="#4338CA"/>

    <!-- Column gutters (subtle verticals) -->
    <rect x="128" y="136" width="4" height="180" fill="#C7D2FE"/>
    <rect x="228" y="136" width="4" height="180" fill="#C7D2FE"/>

    <!-- Decimal axis (accent) — signature float alignment -->
    <rect x="176" y="128" width="14" height="196" rx="3" fill="#F59E0B"/>

    <!-- Row 1 data bars -->
    <rect x="40" y="144" width="78" height="32" rx="6" fill="#818CF8"/>
    <rect x="198" y="144" width="52" height="32" rx="6" fill="#6366F1"/>
    <rect x="248" y="144" width="72" height="32" rx="6" fill="#A5B4FC"/>

    <!-- Row 2 -->
    <rect x="40" y="196" width="110" height="32" rx="6" fill="#818CF8"/>
    <rect x="198" y="196" width="28" height="32" rx="6" fill="#6366F1"/>
    <rect x="248" y="196" width="48" height="32" rx="6" fill="#A5B4FC"/>

    <!-- Row 3 -->
    <rect x="40" y="248" width="54" height="32" rx="6" fill="#818CF8"/>
    <rect x="198" y="248" width="68" height="32" rx="6" fill="#6366F1"/>
    <rect x="248" y="248" width="84" height="32" rx="6" fill="#A5B4FC"/>

    <!-- Bottom rule -->
    <rect x="28" y="308" width="304" height="10" rx="3" fill="#312E81"/>

    <!-- Flex accent: teal corner ticks (flexibility) -->
    <path d="M20 48 L20 20 L48 20" fill="none" stroke="#14B8A6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M340 312 L340 340 L312 340" fill="none" stroke="#14B8A6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <g id="wordmark">
    <text x="478" y="278"
          font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace"
          font-size="72" font-weight="700" letter-spacing="-2">
      <tspan fill="#475569">flexable</tspan><tspan fill="#4338CA">lib</tspan>
    </text>
    <text x="482" y="328"
          font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace"
          font-size="22" font-weight="500" letter-spacing="1.5" fill="#64748B">
      Flexible Table Library
    </text>
  </g>
</svg>
