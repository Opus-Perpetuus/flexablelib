<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Preview — flexablelib</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 2rem; transition: background-color 0.3s, color 0.3s; }
  body.light { background: #f5f5f5; color: #333; }
  body.dark { background: #0d1117; color: #eee; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
  h1 { font-size: 1.5rem; font-weight: 600; }
  h2 { font-size: 1.1rem; font-weight: 600; margin: 2.5rem 0 1rem; }
  .toggle { padding: 0.5rem 1rem; border: 1px solid currentColor; border-radius: 6px; background: transparent; color: inherit; cursor: pointer; font-size: 0.875rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
  .card { border: 1px solid rgba(128,128,128,0.3); border-radius: 12px; overflow: hidden; }
  .card-img { display: flex; align-items: center; justify-content: center; padding: 2rem; min-height: 200px; }
  body.light .card-img { background: #fff; }
  body.dark .card-img { background: #161b22; }
  .card-img img { max-width: 100%; max-height: 180px; }
  .card-label { padding: 0.75rem 1rem; font-size: 0.875rem; font-weight: 500; border-top: 1px solid rgba(128,128,128,0.3); }
  body.light .card-label { background: #fafafa; }
  body.dark .card-label { background: #161b22; }
</style>
</head>
<body class="light">
  <div class="header">
    <h1>flexablelib — brand</h1>
    <button class="toggle" onclick="document.body.classList.toggle('dark');document.body.classList.toggle('light');this.textContent=document.body.classList.contains('dark')?'☀ Light':'🌙 Dark'">🌙 Dark</button>
  </div>

  <h2>Export</h2>
  <div class="grid">
    <div class="card"><div class="card-img"><img src="export/logo.svg" alt="logo"></div><div class="card-label">export/logo.svg</div></div>
    <div class="card"><div class="card-img"><img src="export/icon.svg" alt="icon"></div><div class="card-label">export/icon.svg</div></div>
  </div>

  <h2>Favicon sizes</h2>
  <div style="display:flex;gap:1.5rem;flex-wrap:wrap;align-items:end;">
    <div><img src="export/icon.svg" width="128" height="128"><div style="font-size:0.75rem;opacity:0.6;">128</div></div>
    <div><img src="export/icon.svg" width="64" height="64"><div style="font-size:0.75rem;opacity:0.6;">64</div></div>
    <div><img src="export/icon.svg" width="32" height="32"><div style="font-size:0.75rem;opacity:0.6;">32</div></div>
    <div><img src="export/icon.svg" width="16" height="16"><div style="font-size:0.75rem;opacity:0.6;">16</div></div>
  </div>
</body>
</html>
