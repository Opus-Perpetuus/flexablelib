name: wheels

# One path to PyPI: pushing a tag `vX.Y.Z` builds every wheel plus the sdist
# and publishes them together. The GitHub release is only release notes and
# does not trigger a build -- a second run fired by `release: published`
# used to queue a second macOS job next to the tag's, the tag run's macOS job
# never got a runner, and the tag run published without the macOS wheels.
# When the macOS arm64 pool is short of capacity GitHub cancels a job no runner
# picked up after ~15 minutes; wheels-retry.yml then re-runs the failed jobs.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['setup.py', 'flexablelib/_speedups.c', '.github/workflows/wheels.yml', 'MANIFEST.in', 'packages/**']
  # Recovery: run on a tag ref (Actions -> wheels -> Run workflow -> tag) to
  # rebuild and publish that tag; files already on PyPI are skipped.
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A tag run is never cancelled by another one; a newer push
# to a pull request replaces the older build.
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CIBW_BUILD: 'cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*'
  CIBW_SKIP: '*-win32 *_i686'
  CIBW_TEST_COMMAND: >-
    python -c "from flexablelib.fast import ACCELERATED; assert ACCELERATED"

jobs:
  # 28 wheels per extension project: flexablelib (text measurement) and
  # flexablelib-speedups (frame drawing), built in the same job.
  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # ubuntu: manylinux + musllinux x86_64 (14), windows: amd64 (7),
        # macos-15: arm64 (7). macos-14 is retired; Intel macOS would be
        # macos-15-intel if x86_64 wheels are ever wanted.
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: pypa/cibuildwheel@v3.4.1
      - uses: pypa/cibuildwheel@v3.4.1
        with:
          package-dir: packages/speedups
        env:
          CIBW_TEST_COMMAND: >-
            python -c "from flexablelib_speedups import _frames, _images; assert _frames.fit_line('abc', 2) == 'ab'; assert _images.resize(b'\xff' * 16, 2, 2, 1, 1) == b'\xff' * 4"
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # The sdists of all four projects, plus the two pure-Python wheels.
  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - run: |
          python -m pip install build twine
          python -m build --sdist
          python -m build --sdist --outdir dist packages/speedups
          python -m build --outdir dist packages/tui
          python -m build --outdir dist packages/components
          python -m twine check dist/*
      - uses: actions/upload-artifact@v6
        with: { name: sdist, path: dist/*, if-no-files-found: error }

  # All or nothing: PyPI gets the full set or nothing. If a build job fails or
  # is cancelled, "Re-run failed jobs" finishes the release; skip-existing
  # makes a re-run safe.
  publish:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with: { path: dist, merge-multiple: true }
      - name: Check the version and that every file is there
        run: |
          find dist -type f | sort
          version=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          [ "refs/tags/v$version" = "$GITHUB_REF" ] || { echo "tag $GITHUB_REF does not match package.json $version"; exit 1; }
          for project in flexablelib flexablelib_speedups; do
            wheels=$(ls dist/$project-$version-*.whl | wc -l)
            [ "$wheels" -eq 28 ] || { echo "expected 28 $project wheels, got $wheels"; exit 1; }
            for os in manylinux musllinux win_amd64 macosx; do
              n=$(ls dist/$project-$version-*.whl | grep -c "$os" || true)
              [ "$n" -eq 7 ] || { echo "expected 7 $os $project wheels, got $n"; exit 1; }
            done
          done
          for project in flexablelib_tui flexablelib_components; do
            [ -f "dist/$project-$version-py3-none-any.whl" ] || { echo "missing $project wheel"; exit 1; }
          done
          for project in flexablelib flexablelib_speedups flexablelib_tui flexablelib_components; do
            [ -f "dist/$project-$version.tar.gz" ] || { echo "missing $project sdist"; exit 1; }
          done
          [ "$(ls dist | wc -l)" -eq 62 ] || { echo "expected 62 files"; exit 1; }
          mkdir core extras
          mv dist/flexablelib-$version* core/
          mv dist/* extras/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: core/
          skip-existing: true
      # The optional projects go up after the core, so a core install never
      # points at extras that are not there yet.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: extras/
          skip-existing: true
