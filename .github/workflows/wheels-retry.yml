name: wheels-retry

# GitHub-hosted macOS arm64 runners run short of capacity: a queued job that
# no runner picks up is cancelled after ~15 minutes ("The job was not acquired
# by Runner of type hosted even after multiple attempts"). The tag run then
# ends without publishing anything (publish needs every wheel). Re-run only
# the jobs that failed or were cancelled -- plus publish, which depends on
# them -- up to three more attempts. Built wheels are not rebuilt.
on:
  workflow_run:
    workflows: [wheels]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.run_attempt < 4
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run failed and cancelled jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          echo "wheels run $RUN_ID attempt $ATTEMPT did not succeed; re-running failed jobs"
          sleep 60
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
