name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The package must work with no build step at all: the C extension is
  # declared optional precisely so an install without a compiler still works,
  # and these jobs exercise the pure-Python fallback in text_width.py.
  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04 (ubuntu-latest) no longer offers 3.8 and 3.9.
          - { python-version: '3.8', os: ubuntu-22.04 }
          - { python-version: '3.9', os: ubuntu-22.04 }
          - { python-version: '3.10', os: ubuntu-latest }
          - { python-version: '3.11', os: ubuntu-latest }
          - { python-version: '3.12', os: ubuntu-latest }
          - { python-version: '3.13', os: ubuntu-latest }
          - { python-version: '3.14', os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Run from the repository root: the package is imported straight from
      # the source tree, and the style_name setter reads style_examples.md
      # relative to the working directory.
      - name: Run the test suite
        run: python -m pytest

  # A bare `pip install flexablelib`: none of the optional packages are
  # importable, so the 3.2.0 compatibility copies behind flexablelib.widgets
  # and flexablelib.screen, and the pure-Python frame code, are what run.
  core-only:
    name: pytest (core only, no extras)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run the test suite without the optional packages
        env:
          FLEXABLELIB_CORE_ONLY: '1'
        run: python -m pytest

  # Without this job the C code would never run in CI: text_width.py and
  # _frames.py both promise the C and Python implementations agree exactly.
  # Both extensions are built in place (the core's measurement code and the
  # flexablelib-speedups frame code), and coverage is measured here.
  accelerated:
    name: pytest (C extensions, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build the extensions in place
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt pytest-cov
          cd packages/speedups
          python setup.py build_ext --inplace

      # The extensions are optional, so a failed build is not an error --
      # which would leave this job silently testing the fallbacks again.
      - name: Confirm the C extensions are the live backends
        run: >-
          python -c "import sys; sys.path[:0] = ['packages/speedups'];
          from flexablelib.fast import ACCELERATED, implementation;
          assert ACCELERATED, 'measurement backend is ' + implementation();
          import flexablelib._frames as f;
          assert f.ACCELERATED, 'frame backend is ' + f.BACKEND"

      - name: Run the test suite
        if: matrix.os != 'ubuntu-latest'
        run: python -m pytest

      - name: Run the test suite with coverage
        if: matrix.os == 'ubuntu-latest'
        run: >-
          python -m pytest --cov=flexablelib --cov=flexablelib_tui
          --cov=flexablelib_components --cov-config=.coveragerc
          --cov-report=term --cov-fail-under=95

      # The same suite with the frame extension present but switched off:
      # the switch users get through FLEXABLELIB_FRAMES=python.
      - name: Run the frame tests on the Python backend
        env:
          FLEXABLELIB_FRAMES: python
        run: python -m pytest tests/test_v330_frames.py tests/test_v330_layout.py tests/test_v330_tui.py tests/test_v330_components.py
