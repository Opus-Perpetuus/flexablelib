name: Feature request
description: Suggest a style, option, reader/writer, or other improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case, not just the API you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or output
      description: Sketch the call and the table you would like to see.
      render: python
  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: Does another library (tabulate, prettytable, rich, tabled, …) do this?
